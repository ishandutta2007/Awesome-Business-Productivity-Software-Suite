<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.15); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(40px, -25px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-30px, 30px); }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -100; }
    }
    .orb-1 {
      animation: floatOrb1 9s ease-in-out infinite, pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: floatOrb2 11s ease-in-out infinite, pulseGlow 7s ease-in-out infinite;
      transform-origin: 1000px 300px;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dashTravel 4s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Glowing Background Orbs -->
  <g class="orb-1">
    <circle cx="200" cy="120" r="140" fill="#6366f1" opacity="0.3" filter="url(#glow)" />
  </g>
  <g class="orb-2">
    <circle cx="1020" cy="270" r="160" fill="#ec4899" opacity="0.25" filter="url(#glow)" />
  </g>
  <circle cx="600" cy="380" r="120" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />

  <!-- Animated Data Connection Lines in Background -->
  <path class="flow-line" d="M 80,340 C 300,310 400,380 600,330 C 800,280 900,360 1120,320" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4" />
  <path class="flow-line" d="M 100,70 C 350,110 500,40 700,80 C 900,120 1020,60 1100,90" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.3" />

  <!-- Decorative Architectural Grid Blocks (Right Side Background) -->
  <g opacity="0.25" transform="translate(860, 50)">
    <rect x="0" y="0" width="80" height="60" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <rect x="100" y="20" width="80" height="60" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
    <rect x="50" y="90" width="80" height="60" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <line x1="80" y1="30" x2="100" y2="40" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="40" y1="60" x2="70" y2="90" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />
  </g>

  <!-- Foreground Content: Header Tag, Title, Subtitle, Feature Pills -->
  <g transform="translate(80, 75)">
    <!-- Category Pill -->
    <g>
      <rect x="0" y="0" width="220" height="32" rx="16" fill="#1e293b" stroke="#4f46e5" stroke-width="1.5" />
      <circle cx="16" cy="16" r="5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" class="badge-text" fill="#a5b4fc">ENTERPRISE WORKSPACE</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="95" class="title-text" fill="#ffffff">
      Awesome Business
      <tspan fill="url(#accentGrad)"> Productivity</tspan> Suite
    </text>

    <!-- Subtitle -->
    <text x="0" y="145" class="subtitle-text">
      Curated Ecosystem of SaaS Workspaces, Office Tools &amp; Self-Hosted Open-Source Suites
    </text>

    <!-- Interactive / Status Pills in Foreground -->
    <g transform="translate(0, 195)">
      <!-- Pill 1: SaaS Leaders -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="18" y="24" class="badge-text">☁️ Cloud SaaS Suites</text>
      </g>

      <!-- Pill 2: Open Source -->
      <g transform="translate(195, 0)">
        <rect width="210" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="18" y="24" class="badge-text">🔓 Self-Hosted Alternatives</text>
      </g>

      <!-- Pill 3: Real-time Collab -->
      <g transform="translate(420, 0)">
        <rect width="200" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="18" y="24" class="badge-text">⚡ Real-Time Collaboration</text>
      </g>

      <!-- Pill 4: Data Sovereignty -->
      <g transform="translate(635, 0)">
        <rect width="190" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="18" y="24" class="badge-text">🛡️ Data Sovereignty</text>
      </g>
    </g>
  </g>
</svg>
